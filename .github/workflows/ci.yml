# PR/push CI. Windows is the only supported platform, so everything runs on
# windows-latest. Tests link libmpv, which means synthesising the MSVC import
# library exactly like windows-release.yml does (the dev package ships a MinGW
# .dll.a the MSVC linker can't read).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — test · clippy · fmt
    runs-on: windows-latest
    env:
      MPV_DEV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z
      MPV_DIR: ${{ github.workspace }}\.libmpv
    steps:
      - uses: actions/checkout@v4

      - name: Build the libmpv import library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:MPV_DIR" | Out-Null
          curl.exe -fsSL -o "$env:MPV_DIR\mpv-dev.7z" "$env:MPV_DEV_URL"
          7z x "$env:MPV_DIR\mpv-dev.7z" -o"$env:MPV_DIR" -y | Out-Null
          if (-not (Test-Path "$env:MPV_DIR\libmpv-2.dll")) { throw "libmpv-2.dll not found — did MPV_DEV_URL change shape?" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          Set-Location "$env:MPV_DIR"
          $names = & dumpbin /exports libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "parsed only $($names.Count) exports from libmpv-2.dll" }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content -Path mpv.def -Encoding ascii
          & lib /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64

      # tauri.windows.conf.json lists libmpv-2.dll under bundle.resources; tauri-build fails when
      # it's missing, so every step that compiles the app needs the DLL in place.
      - name: Place libmpv-2.dll for tauri-build
        shell: pwsh
        run: Copy-Item "$env:MPV_DIR\libmpv-2.dll" "$env:GITHUB_WORKSPACE\src-tauri\libmpv-2.dll" -Force

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # Advisory: pre-existing warnings are paid down separately; tests + rustfmt gate.
        run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}\.libmpv

      - name: Tests
        run: cargo test --workspace
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}\.libmpv

  ui:
    name: UI — svelte-check · assertion scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Assertion scripts
        run: |
          for f in src/lib/*.check.ts; do
            echo "::group::$f"
            node --experimental-strip-types "$f"
            echo "::endgroup::"
          done
