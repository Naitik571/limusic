[package]
name = "limusic-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Limusic — desktop YouTube Music client"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "process"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = ["webview-data-url", "tray-icon", "protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# Phase 2 extraction stack (cipher + PoToken). context/04, 05, 13.
# BotGuard runs under deno_core + JSDOM, NOT in a hidden webview. Every token a real browser engine
# mints is rejected by googlevideo; a minimal-DOM runtime is the only one that produces an accepted
# one. Measured in `progress/active/webremix-stream-403.md`. This pulls in V8.
rustypipe-botguard = "0.1.2"
base64 = "0.22"
regex = "1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "http2"] }

innertube = { path = "../crates/innertube" }
player = { path = "../crates/player" }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
# Listen Together: shared wire types + WebSocket client (wss via rustls). context/19.
listen-protocol = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
futures = { workspace = true }
gilrs = { workspace = true }
rand = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
discord-rich-presence = "1.1.0"
# Last.fm API signature (api_sig is md5 of the sorted params + secret).
md-5 = "0.10"
lofty = "0.22.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Real QR codes for the Remote LAN pairing screen (SVG renderer only; no image crate).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
