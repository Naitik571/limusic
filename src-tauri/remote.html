<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>limusic remote</title>
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
	html, body { height: 100%; }
	body {
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		background: radial-gradient(120% 90% at 20% 0%, #1c2030 0%, #12141d 55%, #0b0c12 100%);
		color: #e8eaf2;
		display: flex;
		flex-direction: column;
		align-items: center;
		padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
		gap: 14px;
		user-select: none;
	}
	.card {
		width: 100%;
		max-width: 480px;
		background: rgba(255, 255, 255, 0.05);
		border: 1px solid rgba(255, 255, 255, 0.09);
		border-radius: 18px;
		backdrop-filter: blur(14px);
		padding: 18px;
	}
	h1 { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(232,234,242,.5); text-align: center; }
	.cover {
		width: 132px; height: 132px; border-radius: 14px; margin: 14px auto 12px;
		object-fit: cover;
		background: linear-gradient(135deg, #2a3047, #171a26);
		display: block;
	}
	#title { font-size: 19px; font-weight: 700; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#artist { font-size: 14px; color: rgba(232,234,242,.6); text-align: center; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); margin-top: 14px; overflow: hidden; }
	#pos { height: 100%; width: 0%; border-radius: 2px; background: linear-gradient(90deg, #7c8cf8, #b48cf8); transition: width .4s linear; }
	.times { display: flex; justify-content: space-between; font-size: 11px; color: rgba(232,234,242,.45); margin-top: 5px; font-variant-numeric: tabular-nums; }
	.controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; }
	button {
		appearance: none; border: 1px solid rgba(255,255,255,.1);
		background: rgba(255,255,255,.06); color: #e8eaf2;
		border-radius: 14px; min-height: 58px; font-size: 22px; cursor: pointer;
		display: flex; align-items: center; justify-content: center;
		touch-action: manipulation;
	}
	button:active { background: rgba(255,255,255,.16); transform: scale(.96); }
	button.on { border-color: rgba(124,140,248,.7); color: #b9c2ff; }
	#play { background: linear-gradient(135deg, #6474f0, #9a6cf0); border-color: transparent; font-size: 26px; }
	.volrow { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
	.volrow span { font-size: 18px; }
	#vol { flex: 1; accent-color: #7c8cf8; height: 28px; }
	.modes { display: flex; gap: 10px; margin-top: 10px; }
	.modes button { flex: 1; min-height: 44px; font-size: 13px; font-weight: 600; }
	.searchrow { display: flex; gap: 8px; margin-top: 10px; }
	#q { flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #e8eaf2; border-radius: 12px; padding: 0 12px; font-size: 15px; min-height: 44px; outline: none; }
	#qbtn { flex: none; padding: 0 16px; }
	#results { margin-top: 8px; }
	#results li { cursor: pointer; }
	#results li:active { background: rgba(124,140,248,.2); }
	#statusdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f87171; margin-right: 6px; vertical-align: 1px; }
	#statusdot.ok { background: #4ade80; }
	h2 { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(232,234,242,.5); margin-bottom: 10px; }
	ul { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 42vh; overflow-y: auto; }
	li { padding: 11px 12px; border-radius: 10px; font-size: 14px; color: rgba(232,234,242,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	li.current { background: rgba(124,140,248,.16); color: #e8eaf2; font-weight: 600; }
	li small { display: block; font-weight: 400; font-size: 12px; opacity: .6; }
	#status { font-size: 12px; color: rgba(232,234,242,.4); text-align: center; min-height: 15px; }
</style>
</head>
<body>
	<h1>limusic remote</h1>
	<div class="card" id="nowcard">
		<img id="art" class="cover" alt="" hidden />
		<div id="title">Connecting…</div>
		<div id="artist"></div>
		<div class="bar"><div id="pos"></div></div>
		<div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
		<div class="controls">
			<button id="prev" aria-label="Previous">⏮</button>
			<button id="voldown" aria-label="Volume down">🔉</button>
			<button id="play" aria-label="Play or pause">▶</button>
			<button id="volup" aria-label="Volume up">🔊</button>
			<button id="next" aria-label="Next">⏭</button>
		</div>
		<div class="volrow"><span>🔈</span><input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume" /><span>🔊</span></div>
		<div class="modes">
			<button id="shuffle" aria-label="Shuffle">SHUFFLE: OFF</button>
			<button id="repeat" aria-label="Repeat">REPEAT: OFF</button>
		</div>
		<div class="searchrow">
			<input id="q" type="search" placeholder="Add to queue…" aria-label="Search and add" />
			<button id="qbtn" aria-label="Search">⌕</button>
		</div>
		<ul id="results"></ul>
	</div>
	<div class="card">
		<h2>Up next</h2>
		<ul id="queue"></ul>
	</div>
	<div id="status"><span id="statusdot"></span><span id="statustext"></span></div>
<script>
	// Token: QR first, then remembered per host so the QR is a one-time pairing.
	var qs = new URLSearchParams(location.search);
	var token = qs.get('token') || '';
	try {
		if (!token) token = localStorage.getItem('limusic-remote-token:' + location.host) || '';
	} catch (e) {}
	function url(path) { return path + '?token=' + encodeURIComponent(token); }
	function post(path, body) {
		var opts = { method: 'POST' };
		if (body !== undefined) {
			opts.headers = { 'Content-Type': 'application/json' };
			opts.body = JSON.stringify(body);
		}
		return fetch(url(path), opts).then(refresh).catch(function () {});
	}
	function fmt(secs) {
		if (!isFinite(secs) || secs <= 0) return '0:00';
		var m = Math.floor(secs / 60), s = Math.floor(secs % 60);
		return m + ':' + (s < 10 ? '0' : '') + s;
	}
	function esc(t) {
		var d = document.createElement('div');
		d.textContent = t == null ? '' : String(t);
		return d.innerHTML;
	}
	var el = function (id) { return document.getElementById(id); };
	var art = el('art'), title = el('title'), artist = el('artist'), pos = el('pos'),
		tcur = el('tcur'), tdur = el('tdur'), play = el('play'), queue = el('queue'),
		dot = el('statusdot'), statustext = el('statustext'),
		vol = el('vol'), shuffleBtn = el('shuffle'), repeatBtn = el('repeat'),
		q = el('q'), qbtn = el('qbtn'), results = el('results'), nowcard = el('nowcard');
	var volInit = false, volTimer = null;
	function setStatus(ok, msg) {
		dot.className = ok ? 'ok' : '';
		dot.id = 'statusdot';
		statustext.textContent = msg || '';
		if (ok) {
			try { localStorage.setItem('limusic-remote-token:' + location.host, token); } catch (e) {}
		}
	}
	function refresh() {
		fetch(url('/api/playback')).then(function (r) {
			if (!r.ok) throw new Error('auth');
			return r.json();
		}).then(function (pb) {
			setStatus(true, '');
			var n = pb.now;
			title.textContent = n ? n.title : 'Nothing playing';
			artist.textContent = n ? n.artists : 'Open limusic and play something';
			play.textContent = pb.paused ? '▶' : '⏸';
			if (n && n.thumbnail) { art.src = n.thumbnail; art.hidden = false; } else { art.hidden = true; }
			pos.style.width = (pb.duration > 0 ? Math.min(100, pb.position / pb.duration * 100) : 0) + '%';
			tcur.textContent = fmt(pb.position);
			tdur.textContent = fmt(pb.duration);
			return fetch(url('/api/queue')).then(function (r) { return r.ok ? r.json() : null; }).then(function (qq) {
				var items = (qq && qq.items) || [], cur = qq ? qq.currentIndex : -1;
				shuffleBtn.textContent = 'SHUFFLE: ' + (qq && qq.shuffle ? 'ON' : 'OFF');
				shuffleBtn.className = qq && qq.shuffle ? 'on' : '';
				var rep = (qq && qq.repeat ? String(qq.repeat).toUpperCase() : 'OFF');
				repeatBtn.textContent = 'REPEAT: ' + rep;
				repeatBtn.className = rep !== 'OFF' ? 'on' : '';
				queue.innerHTML = items.slice(Math.max(cur, 0), Math.max(cur, 0) + 25).map(function (it, i) {
					var isCur = Math.max(cur, 0) + i === cur;
					return '<li class="' + (isCur ? 'current' : '') + '">' + esc(it.title) +
						'<small>' + esc(it.artists) + (isCur ? ' • now playing' : '') + '</small></li>';
				}).join('') || '<li>Queue is empty</li>';
			});
		}).catch(function (e) {
			if (e && e.message === 'auth') setStatus(false, 'Token invalid — re-open from the in-app QR.');
			else setStatus(false, 'Reconnecting…');
		});
		if (!volInit) {
			volInit = true;
			fetch(url('/api/volume')).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
				if (v && isFinite(v.volume)) vol.value = v.volume;
			}).catch(function () {});
		}
	}
	function doSearch() {
		var term = q.value.trim();
		if (!term) { results.innerHTML = ''; return; }
		fetch(url('/api/search') + '&q=' + encodeURIComponent(term)).then(function (r) {
			return r.ok ? r.json() : null;
		}).then(function (r) {
			var items = (r && r.items) || (Array.isArray(r) ? r : []);
			results.innerHTML = items.slice(0, 8).map(function (it, i) {
				return '<li data-i="' + i + '">' + esc(it.title) + '<small>' + esc(it.artists) + '</small></li>';
			}).join('') || '<li>No results</li>';
			Array.prototype.forEach.call(results.querySelectorAll('li[data-i]'), function (li) {
				li.onclick = function () {
					var it = items[Number(li.getAttribute('data-i'))];
					post('/api/play', it).then(function () { results.innerHTML = ''; q.value = ''; });
				};
			});
		}).catch(function () {});
	}
	prev.onclick = function () { post('/api/prev'); };
	next.onclick = function () { post('/api/next'); };
	play.onclick = function () { post('/api/toggle'); };
	volup.onclick = function () { post('/api/volup'); };
	voldown.onclick = function () { post('/api/voldown'); };
	shuffleBtn.onclick = function () { post('/api/shuffle'); };
	repeatBtn.onclick = function () { post('/api/repeat'); };
	qbtn.onclick = doSearch;
	q.onkeydown = function (e) { if (e.key === 'Enter') doSearch(); };
	vol.oninput = function () {
		if (volTimer) clearTimeout(volTimer);
		volTimer = setTimeout(function () {
			fetch(url('/api/volume') + '&v=' + encodeURIComponent(vol.value), { method: 'POST' }).catch(function () {});
		}, 200);
	};
	// Swipe the now-playing card: left = next, right = previous.
	(function () {
		var x0 = null;
		nowcard.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
		nowcard.addEventListener('touchend', function (e) {
			if (x0 === null) return;
			var dx = e.changedTouches[0].clientX - x0;
			x0 = null;
			if (dx < -60) post('/api/next');
			else if (dx > 60) post('/api/prev');
		}, { passive: true });
	})();
	refresh();
	setInterval(refresh, 3000);
</script>
</body>
</html>
