<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>limusic overlay</title>
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { height: 100%; }
	body {
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		color: #fff;
		overflow: hidden;
		text-shadow: 0 1px 8px rgba(0,0,0,.7);
	}
	body[data-theme="solid"] { background: #101014; text-shadow: none; }
	body[data-theme="blur"] { background: rgba(10,10,16,.45); backdrop-filter: blur(14px); }
	#root { display: flex; gap: 18px; padding: 18px; height: 100%; }
	body[data-layout="vertical"] #root { flex-direction: column; }
	img#art {
		width: 148px; height: 148px; border-radius: 12px; object-fit: cover; flex: none;
		box-shadow: 0 8px 30px rgba(0,0,0,.5);
	}
	body[data-layout="vertical"] img#art { width: 120px; height: 120px; }
	#meta { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
	#title { font-size: 30px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#artist { font-size: 17px; opacity: .75; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); margin-top: 12px; overflow: hidden; }
	#fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; }
	#times { display: flex; justify-content: space-between; font-size: 12px; opacity: .7; margin-top: 4px; font-variant-numeric: tabular-nums; }
	#lyrics { flex: 1.4; min-width: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
	.lyric { font-size: 19px; font-weight: 600; opacity: .42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; }
	.lyric.past { opacity: .22; }
	.lyric.active { opacity: 1; font-size: 24px; }
	#queue { width: 240px; flex: none; overflow: hidden; font-size: 13px; opacity: .85; }
	body[data-layout="vertical"] #queue { width: auto; }
	#queue div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; opacity: .7; }
	#queue div:first-child { opacity: 1; font-weight: 700; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="root">
	<img id="art" alt="" hidden />
	<div id="meta">
		<div id="title">limusic</div>
		<div id="artist">waiting for playback…</div>
		<div id="progwrap"><div id="bar"><div id="fill"></div></div><div id="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div></div>
	</div>
	<div id="lyrics" hidden></div>
	<div id="queue" hidden></div>
</div>
<script>
	var q = new URLSearchParams(location.search);
	var token = q.get('token') || '';
	var layout = q.get('layout') === 'vertical' ? 'vertical' : 'horizontal';
	var theme = q.get('theme') || 'transparent';
	var show = function (k, d) { var v = q.get(k); return v === null ? d : v !== '0'; };
	var want = {
		art: show('art', true), title: show('title', true), prog: show('prog', true),
		lyrics: show('lyrics', true), queue: show('queue', false)
	};
	document.body.dataset.layout = layout;
	document.body.dataset.theme = ['transparent', 'blur', 'solid'].indexOf(theme) >= 0 ? theme : 'transparent';
	function url(path) { return path + '?token=' + encodeURIComponent(token); }
	function fmt(s) {
		if (!isFinite(s) || s <= 0) return '0:00';
		var m = Math.floor(s / 60), ss = Math.floor(s % 60);
		return m + ':' + (ss < 10 ? '0' : '') + ss;
	}
	function esc(t) {
		var d = document.createElement('div');
		d.textContent = t == null ? '' : String(t);
		return d.innerHTML;
	}
	var el = function (id) { return document.getElementById(id); };
	var art = el('art'), title = el('title'), artist = el('artist'),
		fill = el('fill'), tcur = el('tcur'), tdur = el('tdur'),
		lyricsBox = el('lyrics'), queueBox = el('queue'), progwrap = el('progwrap');
	if (!want.art) art.hidden = true;
	if (!want.title) { title.hidden = true; artist.hidden = true; }
	if (!want.prog) progwrap.hidden = true;
	if (want.lyrics) lyricsBox.hidden = false;
	if (want.queue) queueBox.hidden = false;
	// Lyrics cache per track: fetched once per videoId, advanced locally by position.
	var lyricCache = { id: null, lines: [] };
	function activeIdx(lines, pos) {
		var idx = -1;
		for (var i = 0; i < lines.length; i++) {
			if (lines[i].t === null || lines[i].t === undefined) continue;
			if (lines[i].t / 1000 > pos) break;
			idx = i;
		}
		return idx;
	}
	function renderLyrics(lines, pos) {
		if (!lines.length) { lyricsBox.innerHTML = ''; return; }
		var ai = activeIdx(lines, pos);
		var from = Math.max(0, ai - 1), html = '';
		for (var i = from; i < Math.min(lines.length, from + 4); i++) {
			var cls = i === ai ? 'lyric active' : (i < ai ? 'lyric past' : 'lyric');
			html += '<div class="' + cls + '">' + esc(lines[i].text || '♪') + '</div>';
		}
		lyricsBox.innerHTML = html;
	}
	function poll() {
		fetch(url('/api/playback')).then(function (r) {
			if (!r.ok) throw 0;
			return r.json();
		}).then(function (pb) {
			var n = pb.now;
			title.textContent = n ? n.title : 'limusic';
			artist.textContent = n ? n.artists : 'waiting for playback…';
			if (want.art) {
				if (n && n.thumbnail) { art.src = n.thumbnail; art.hidden = false; }
				else art.hidden = true;
			}
			if (want.prog) {
				fill.style.width = (pb.duration > 0 ? Math.min(100, pb.position / pb.duration * 100) : 0) + '%';
				tcur.textContent = fmt(pb.position);
				tdur.textContent = fmt(pb.duration);
			}
			if (want.lyrics) {
				if (n && n.video_id && lyricCache.id !== n.video_id) {
					lyricCache = { id: n.video_id, lines: [] };
					(function (vid) {
						fetch(url('/api/lyrics') + '&videoId=' + encodeURIComponent(vid)).then(function (r) {
							return r.ok ? r.json() : null;
						}).then(function (l) {
							if (l && l.synced && l.lines && lyricCache.id === vid) lyricCache = { id: vid, lines: l.lines };
						}).catch(function () {});
					})(n.video_id);
				}
				if (!n || !n.video_id) lyricCache = { id: null, lines: [] };
				renderLyrics(lyricCache.lines, pb.position || 0);
			}
			if (want.queue) {
				fetch(url('/api/queue')).then(function (r) { return r.ok ? r.json() : null; }).then(function (qq) {
					if (!qq || !qq.items) return;
					var cur = qq.currentIndex || 0;
					queueBox.innerHTML = qq.items.slice(cur, cur + 6).map(function (it) {
						return '<div>' + esc(it.title) + '</div>';
					}).join('');
				}).catch(function () {});
			}
		}).catch(function () {
			title.textContent = 'limusic';
			artist.textContent = 'waiting for playback…';
		});
	}
	poll();
	setInterval(poll, 1000);
</script>
</body>
</html>
